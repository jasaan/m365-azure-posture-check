[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-azure-posture-check"
version = "0.1.0"
description = "Read-only Microsoft 365 / Entra ID security posture check using Microsoft Graph."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "azure-identity>=1.15"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["posture"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
